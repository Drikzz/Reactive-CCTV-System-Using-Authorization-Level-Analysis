# CCTV Surveillance System - Quick Guide

**What it does:** Detects people, recognizes faces, monitors behavior (for restricted users only).

---

## System Overview

### 3 AI Models Working Together:

| Model | Job | Always Runs? |
|-------|-----|--------------|
| **YOLOv8** | Find people → Track IDs | ✅ Yes |
| **FaceNet** | Recognize faces → Identity | ✅ Yes |
| **MobileNetV2** | Check behavior | ⚠️ Only for "Partially Authorized" |

---

## Authorization Levels

| Person | Level | Box Color | Behavior Monitored? |
|--------|-------|-----------|---------------------|
| dean, art | ✅ Authorized | 🟢 Green | No |
| myke, aldrikz | ⚠️ Partially Authorized | 🟠 Orange | **Yes** |
| Unknown | ❌ Unauthorized | 🔴 Red | No |

**Why?** Save 40% compute by only monitoring restricted-access users.

---

## Processing Flow

```
Video → YOLO (detect) → FaceNet (identify) → Authorization Check
                                                      ↓
                                    ┌─────────────────┴────────────────┐
                                    ↓                                  ↓
                          Partially Authorized?              Authorized/Unauthorized?
                                    ↓                                  ↓
                          MobileNetV2 (behavior)              Skip behavior check
                                    ↓                                  ↓
                                    └─────────────────┬────────────────┘
                                                      ↓
                                              Log events → Draw boxes
```

---

