## Command-Line Usage

```bash
# Webcam (default)
python combined_yolo_facenet_mnv3.py

# Video file
python combined_yolo_facenet_mnv3.py --video test.mp4

# Fast mode (30-40 FPS)
python combined_yolo_facenet_mnv3.py --video test.mp4 --frame-skip 10 --resize-factor 0.3

# Accurate mode (8-15 FPS)
python combined_yolo_facenet_mnv3.py --video test.mp4 --frame-skip 1 --resize-factor 1.0

# Use GPU
python combined_yolo_facenet_mnv3.py --device cuda
```

---

## Key Parameters

| Parameter | What It Does | Recommended |
|-----------|--------------|-------------|
| `--frame-skip` | Process every Nth frame | 2-3 |
| `--resize-factor` | Scale resolution (0.1-1.0) | 0.5 |
| `--recog-interval` | Frames between face checks | 30 |
| `--smooth-window` | Average behavior over N frames | 7 |
| `--min-class-conf` | Min confidence for behavior | 0.6-0.7 |

**Trade-off:** Higher values = Faster but less accurate

