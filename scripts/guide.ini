## Smart Features

### 1. **Identity Locking**
- Locks identity after N face detections
- Maintains during back-view (body matching)
- Confidence decay (not instant reset)

### 2. **Adaptive Recognition**
- Unauthorized: Check every 15 frames (identify quickly!)
- Partially Authorized: Every 30 frames (standard)
- Authorized (locked): Every 150 frames (save compute)

### 3. **Temporal Smoothing**
- Averages predictions over sliding window
- Reduces jitter in behavior classification

